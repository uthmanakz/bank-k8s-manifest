apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bank
spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: postgres-sa

      containers:
        - name: postgres
          image: postgres:15

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER_FILE
              value: /mnt/secrets/POSTGRES_USER

            - name: POSTGRES_PASSWORD_FILE
              value: /mnt/secrets/POSTGRES_PASSWORD

            - name: POSTGRES_DB_FILE
              value: /mnt/secrets/POSTGRES_DB

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: postgres-secrets
              mountPath: /mnt/secrets
              readOnly: true

            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true


      volumes:
        - name: postgres-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: postgres-secrets


        - name: postgres-init
          configMap:
          name: postgres-init

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp2
        resources:
          requests:
            storage: 20Gi
